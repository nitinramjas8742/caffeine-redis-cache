# ---------------------------------------------------------------------------
# Datasource (H2 in-memory so the demo runs without external services)
# ---------------------------------------------------------------------------
quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.jdbc.url=jdbc:h2:mem:fun3;DB_CLOSE_DELAY=-1

# ---------------------------------------------------------------------------
# Hibernate ORM
# ---------------------------------------------------------------------------
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql
quarkus.hibernate-orm.second-level-caching-enabled=true
quarkus.hibernate-orm.statistics=true
quarkus.hibernate-orm.log.sql=false

# ---------------------------------------------------------------------------
# Redis used by the hybrid cache extension for timestamp invalidation.
# The application still works (local-only tier) when Redis is unavailable.
# ---------------------------------------------------------------------------
quarkus.redis.hosts=redis://localhost:6379

# ---------------------------------------------------------------------------
# Hybrid cache near-cache (Redisson RLocalCachedMap semantics)
#
# The global timestamps live in Redis and are mirrored locally. A repeated read
# is served from the local mirror; Redis is only contacted on the first read of
# a key, after an invalidation, or on a write. Disable pub/sub only if you accept
# stale reads until a reconnect (Redisson syncStrategy=INVALIDATE would behave
# the same without a working topic).
#
# Pub/sub lifecycle. The invalidation topic is what keeps near-caches coherent
# across pods, so a dead subscription must never stay silently "subscribed":
#   - the subscription is resubscribed with a fixed delay after it ends;
#   - a heartbeat round-trip detects a silently dead connection;
#   - once the gap is detected every local near-cache is cleared, because
#     invalidations published during the outage were lost.
# Set clear-on-reconnect=false to reproduce raw Redisson ReconnectionStrategy.NONE.
# ---------------------------------------------------------------------------
#quarkus.hybrid-cache.pubsub.enabled=true
#quarkus.hybrid-cache.pubsub.reconnect-delay-ms=2000
#quarkus.hybrid-cache.pubsub.heartbeat-interval-ms=2000
#quarkus.hybrid-cache.pubsub.heartbeat-timeout-ms=6000
#quarkus.hybrid-cache.pubsub.clear-on-reconnect=true

# ---------------------------------------------------------------------------
# Reconnection strategy once Redis becomes reachable again:
#   NONE  - keep the local mirror (Redisson default)
#   CLEAR - drop it, entries are re-read from Redis
#   LOAD  - drop it and reload lazily on the next read
#
# Optional staleness bound. 0 disables it (Redisson timeToLive=0 equivalent).
# Set e.g. 30000 to force a Redis revalidation even if a connection dies without
# ever being detected (silent network partition, lost heartbeat timer, ...).
#
# recovery-grace-ms forces near-cache hits to revalidate for a short window after
# a reconnect. retry-delay-ms is the cooldown before Redis is retried after a
# failed command. maximum-size bounds the local Caffeine payload tier per region.
# ---------------------------------------------------------------------------
#quarkus.hybrid-cache.near-cache.reconnection-strategy=NONE
#quarkus.hybrid-cache.near-cache.ttl-ms=0
#quarkus.hybrid-cache.near-cache.recovery-grace-ms=8000
#quarkus.hybrid-cache.redis.retry-delay-ms=5000
#quarkus.hybrid-cache.storage.maximum-size=10000
#quarkus.hybrid-cache.storage.record-stats=false
